<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The flooded nave in three bands: light shafts shifting and silt drifting and a fish school crossing in the far band, octopus arms curling round a pillar and anglerfish lures swaying and coral polyps opening and closing in the middle band, and the tower with its motionless bell, a trembling gauge needle and snagged pearl strands in the near band">
