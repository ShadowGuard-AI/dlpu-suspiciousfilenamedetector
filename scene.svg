<g fill="#de967e"><circle cx="52" cy="252" r="6"><animate attributeName="r" values="6;3.4;6" dur="6s" repeatCount="indefinite"/></circle><circle cx="70" cy="238" r="5"><animate attributeName="r" values="5;3;5" dur="8s" repeatCount="indefinite"/></circle></g>
